# Book settings
# Learn more at https://jupyterbook.org/customize/config.html

title: DVMProject Documentation
author: The DVMProject Development Team
logo: media/logos/project.png

# There are no executable notebooks in this book.
execute:
  execute_notebooks: "off"

# Define the name of the latex output file for PDF builds
latex:
  latex_documents:
    targetname: book.tex

# MyST parser extensions
parse:
  myst_enable_extensions:
    - colon_fence
    - deflist
    - linkify
    - substitution

# Sphinx / MyST configuration
sphinx:
  extra_extensions:
    - sphinx_copybutton
    - sphinx_design
    - sphinxcontrib.mermaid
  config:
    # Generate anchors for h1-h3 headings so cross-file [text](page.md#heading) links resolve
    myst_heading_anchors: 3
    # Don't fail the build on non-fatal warnings, but do surface them
    nitpicky: false

# Information about where the book exists on the web
repository:
  url: https://github.com/DVMProject/dvmdocs
  path_to_book: dvmdocs
  branch: main

# Add GitHub buttons to your book
# See https://jupyterbook.org/customize/config.html#add-a-link-to-your-repository
html:
  use_issues_button: true
  use_repository_button: true
  use_edit_page_button: true
  announcement: "These documents are actively being improved by the DVMProject community. Some pages are still incomplete — corrections and pull requests are welcome at https://github.com/DVMProject/dvmdocs"
